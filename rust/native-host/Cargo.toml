[package]
name = "formax-native-host"
version = "0.1.0"
edition = "2021"
description = "Formax Chrome Native Messaging host implemented in Rust"

[dependencies]
anyhow = "1"
axum = "0.7"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
