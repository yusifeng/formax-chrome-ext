<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
        --text: #202124;
        --muted: #5f6368;
        --border: #e5e7eb;
        --surface: #ffffff;
        --surface-muted: #f8f9fa;
        --green: #07883f;
        --green-bg: #eaf8ee;
        --green-border: #cdeed7;
        --red: #b3261e;
        --red-bg: #fceeee;
        --red-border: #f4c7c3;
        --gray: #6b7280;
        --gray-bg: #f3f4f6;
        --gray-border: #e5e7eb;
        --blue: #1a73e8;
        --blue-bg: #eef4ff;
        --amber: #8a5a00;
        --amber-bg: #fff7df;
        --card-bg: #f9f9f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        padding: 18px 16px 16px;
        background: var(--surface);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: 0;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin-bottom: 14px;
      }

      .brand-logo {
        width: 24px;
        height: 24px;
        display: block;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
        font-weight: 600;
        padding: 10px 0;
      }

      .card {
        padding: 10px 14px 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card-bg);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        max-width: 100%;
        padding: 4px 10px;
        border: 1px solid var(--gray-border);
        border-radius: 999px;
        background: var(--gray-bg);
        color: var(--gray);
        font-size: 12px;
        line-height: 1;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        flex: 0 0 auto;
        margin-right: 7px;
        border-radius: 999px;
        background: currentColor;
      }

      .status-pill[data-state="connected"] {
        border-color: var(--green-border);
        background: var(--green-bg);
        color: var(--green);
      }

      .status-pill[data-state="disconnected"],
      .status-pill[data-state="error"] {
        border-color: var(--red-border);
        background: var(--red-bg);
        color: var(--red);
      }

      .icon-button {
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .icon-button:hover {
        background: var(--surface-muted);
        color: var(--text);
      }

      .icon-button:focus-visible {
        outline: 2px solid #1a73e8;
        outline-offset: 2px;
      }

      .description {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

      a {
        color: inherit;
        text-underline-offset: 3px;
      }

      .version {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.25;
      }

    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img class="brand-logo" src="icons/icon-48.png" alt="" />
        <h1>Formax</h1>
      </div>

      <section class="card" aria-live="polite">
        <div class="card-header">
          <div id="status" class="status-pill" data-state="checking">
            <span class="status-dot"></span>
            <span id="status-label">Checking...</span>
          </div>

          <button id="refresh" class="icon-button" type="button" aria-label="Check connection" title="Check connection">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16" />
              <path d="M3 21v-5h5" />
              <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8" />
              <path d="M21 3v5h-5" />
            </svg>
          </button>
        </div>

        <p class="description">
          Control Chrome with Formax.
          <a href="https://github.com/yusifeng/formax-chrome-ext" target="_blank" rel="noreferrer">Learn more</a>
        </p>
        <p id="version" class="version">Version v0.1.0</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
