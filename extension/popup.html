<!doctype html>
<html>
  <head>

    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .status {
        padding: 8px 10px;
        border-radius: 8px;
        background: #f3f4f6;
        margin-bottom: 12px;
      }

      button {

        height: 34px;
      }

      pre {
        white-space: pre-wrap;
        font-size: 12px;
        background: #f9fafb;
        padding: 8px;
        border-radius: 8px;
        max-height: 220px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>Formax</h1>
    <div id="status" class="status">Checking...</div>
    <button id="health">Check health</button>
